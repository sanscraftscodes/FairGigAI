[project]
name = "fairgig-ai"
version = "1.0.0"
requires-python = "==3.12.*"
dependencies = [
    "fastapi==0.142.2",
    "pydantic==2.12.4",
    "numpy==2.3.3",
    "joblib==1.5.3",
    "sqlalchemy==2.1.4",
    "psycopg[binary]==3.2.13",
    "httpx==0.28.1",
    "python-dotenv==1.1.1",
]

[project.optional-dependencies]
# Local training / model export only — NOT installed on Vercel
model-training = [
    "scikit-learn==1.6.1",
    "catboost==1.2.10",
    "scipy==1.17.1",
    "pandas==2.3.3",
]

[tool.vercel]
entrypoint = "backend.vercel_app:app"
